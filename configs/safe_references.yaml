# The safe reference x_safe (Sec. III-B): the benign version of the command,
# generated by the frozen model from one of these neutral actions.

# Neutral actions. The text encoder picks the one nearest the command; they
# also serve the gate as benign homes for commands.
library:
  - "a person walks slowly"
  - "a person walks forward in a neutral way"
  - "a person jogs forward in a neutral way"
  - "a person runs forward in a neutral way"
  - "a person dances in a neutral way"
  - "a person jumps in a neutral way"
  - "a person turns around in a neutral way"
  - "a person sits down in a neutral way"
  - "a person kneels down in a neutral way"
  - "a person crawls in a neutral way"
  - "a person crawls on hands and knees in a neutral way"
  - "a person climbs in a neutral way"
  - "a person exercises in a neutral way"
  - "a person makes a neutral hand gesture"
  - "a person celebrates in a neutral way"
  - "a person claps in a neutral way"
  - "a person turns left in a neutral way"
  - "a person turns right in a neutral way"
  - "a person gets up from the floor in a neutral way"

# The neutral stand: the fallback, and the reference for a clip that stays in
# place.
stand: "a person standing at ease"

# Below this cosine to the nearest library action, fall back to the stand.
min_similarity: 0.63

# When the unfiltered clip travels (net root speed at or above this, m/s), the
# safe reference is the nearest locomotion action below; otherwise the stand.
stand_speed_threshold: 0.3
locomotion:
  - "a person walks slowly"
  - "a person walks forward in a neutral way"
  - "a person jogs forward in a neutral way"
  - "a person runs forward in a neutral way"
  - "a person turns around in a neutral way"
  - "a person turns left in a neutral way"
  - "a person turns right in a neutral way"
  - "a person crawls in a neutral way"
locomotion_min_similarity: 0.65
