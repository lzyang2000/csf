<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CSF demo: generation with and without the filter</title>
<link rel="icon" href="../static/images/favicon.png">
<script type="importmap">{ "imports": { "three": "./vendor/three.module.min.js" } }</script>
<style>
  :root {
    --before: #ff5a2c; --after: #1f8fff; --person: #45c25a;
    --ink: #1f2328; --muted: #57606a; --line: #d0d7de; --bg: #f3f4f6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .rowlabel { position: fixed; left: 12px; font-weight: 600; padding: 2px 8px; pointer-events: none;
    background: rgba(255,255,255,0.85); border: 1px solid var(--line); border-radius: 4px; }
  #label-left { top: 10px; border-left: 4px solid var(--before); }
  #label-right { top: calc(var(--row-h, 40vh) + 10px); border-left: 4px solid var(--after); }
  .divider { position: fixed; left: 0; right: 0; top: var(--row-h, 40vh); height: 1px; background: var(--line); }
  #margins { min-width: 0; }
  #margins .note { margin: 0 0 6px; color: var(--muted); font-size: 12.5px; }
  .rule { display: grid; grid-template-columns: 8.5em 1fr 8.5em; align-items: center; gap: 6px;
    font-size: 12.5px; margin: 3px 0; }
  .rule .track { position: relative; height: 14px; background: #eef0f3; border-radius: 3px; }
  .rule .zero { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); }
  .rule .dot { position: absolute; top: 2px; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; }
  .rule .before { background: var(--before); }
  .rule .after { background: var(--after); border: 1.5px solid #fff; }
  .rule .val { color: var(--muted); font-variant-numeric: tabular-nums; text-align: right; }
  .bar { position: fixed; left: 12px; right: 12px; bottom: 12px; background: rgba(255,255,255,0.96);
    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; display: grid;
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 6px 18px; align-items: start; }
  .controls { display: grid; gap: 6px; min-width: 0; }
  .row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  select, button { font: inherit; color: var(--ink); background: #fff; border: 1px solid var(--line);
    border-radius: 4px; padding: 3px 9px; cursor: pointer; }
  button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .group { display: inline-flex; }
  .group button { border-radius: 0; margin-left: -1px; }
  .group button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  .group button:last-child { border-radius: 0 4px 4px 0; }
  #prompt { color: var(--muted); }
  #step { flex: 1; min-width: 160px; accent-color: var(--after); }
  #steplabel { font-variant-numeric: tabular-nums; min-width: 8.5em; text-align: right; color: var(--muted); }
  label { display: inline-flex; align-items: center; gap: 5px; cursor: pointer; }
  input[type=checkbox] { accent-color: var(--person); width: 16px; height: 16px; }
  #error { position: fixed; top: 40%; left: 50%; transform: translateX(-50%); background: #fff;
    border: 1px solid var(--line); padding: 12px 16px; border-radius: 6px; }
  @media (max-width: 760px) {
    .bar { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<canvas id="view"></canvas>
<span class="rowlabel" id="label-left">Without CSF</span>
<span class="rowlabel" id="label-right">With CSF</span>
<div class="divider"></div>
<div class="bar">
 <div class="controls">
  <div class="row">
    <select id="scene" aria-label="Scene"></select>
    <label><input type="checkbox" id="person" checked> Person in scene</label>
    <span id="prompt"></span>
  </div>
  <div class="row">
    <span class="group"><button data-view="motion">Motion</button><button data-view="strobe">Strobe</button></span>
    <button id="play">Play steps</button>
    <input type="range" id="step" min="0" max="24" value="0" aria-label="Sampling step">
    <span id="steplabel"></span>
  </div>
 </div>
 <div id="margins"></div>
</div>
<div id="error" hidden></div>
<script type="module" src="demo.js"></script>
</body>
</html>
